<!DOCTYPE html>
<html>
<head>
    <title>WorkSmart Madagascar</title>
</head>
<body>

<h1>Gestion Personnel</h1>

<h2>Ajouter Employé</h2>

<input id="matricule" placeholder="Matricule">
<input id="nom" placeholder="Nom">
<input id="adresse" placeholder="Adresse">

<button onclick="addEmployee()">Ajouter</button>

<hr>

<button onclick="loadEmployees()">Charger liste</button>

<ul id="list"></ul>

<script>

const API = "https://TON-RENDER-URL.onrender.com"; 
// ⚠️ remplace par ton lien Render

function addEmployee() {
    fetch(API + "/employees", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            matricule: document.getElementById("matricule").value,
            nom: document.getElementById("nom").value,
            adresse: document.getElementById("adresse").value,
            section: "N/A",
            fonction: "N/A",
            statut: "CDI",
            etat: "Actif"
        })
    })
    .then(r => r.json())
    .then(data => alert(data.message || data.error));
}

function loadEmployees() {
    fetch(API + "/employees")
    .then(r => r.json())
    .then(data => {
        let list = document.getElementById("list");
        list.innerHTML = "";
        data.forEach(e => {
            let li = document.createElement("li");
            li.innerText = e[1] + " - " + e[2];
            list.appendChild(li);
        });
    });
}

</script>

</body>
</html>
