<!DOCTYPE html>
<html>
<head>
    <title>WorkSmart Madagascar</title>
</head>
<body>

<h1>Gestion Personnel</h1>

<h2>Ajouter Employé</h2>

<input id="matricule" placeholder="Matricule">
<input id="nom" placeholder="Nom">
<input id="adresse" placeholder="Adresse">

<button onclick="addEmployee()">Ajouter</button>

<hr>

<button onclick="loadEmployees()">Charger liste</button>

<ul id="list"></ul>

<script>

const API = "https://worksmart-backend-wtwh.onrender.com";

function addEmployee() {

    fetch(API + "/employees", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            matricule: document.getElementById("matricule").value,
            nom: document.getElementById("nom").value,
            adresse: document.getElementById("adresse").value,
            section: "N/A",
            fonction: "N/A",
            statut: "CDI",
            etat: "Actif"
        })
    })
    .then(async r => {
        let data = await r.json();

        if (!r.ok) {
            throw new Error(data.error || "Erreur serveur");
        }

        alert("✔ Ajout réussi !");
        loadEmployees();
    })
    .catch(err => {
        alert("❌ Erreur: " + err.message);
        console.log(err);
    });

}

function loadEmployees() {

    fetch(API + "/employees")
    .then(async r => {
        if (!r.ok) throw new Error("API inaccessible");
        return r.json();
    })
    .then(data => {

        let list = document.getElementById("list");
        list.innerHTML = "";

        data.forEach(e => {

            let li = document.createElement("li");

            // sécurité si structure change
            li.innerText = (e[1] || "??") + " - " + (e[2] || "??");

            list.appendChild(li);
        });

    })
    .catch(err => {
        alert("❌ Impossible de charger: " + err.message);
        console.log(err);
    });

}

</script>

</body>
</html>
